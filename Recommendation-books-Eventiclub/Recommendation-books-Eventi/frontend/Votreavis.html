<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laisser votre avis - Eventi club</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-2 px-3">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="img/logo-hotel.png" alt="Logo Hôtel" width="48" height="48" class="me-2">
      Eventi club
    </a>
  </nav>
  <header class="bg-primary text-white text-center py-5 mb-4 shadow">
    <h1 class="display-4 fw-bold mb-2">Laisser votre avis</h1>
    <p class="lead mb-0">Partagez votre expérience avec nous !</p>
  </header>
  <main class="container mb-5">
    <!-- Formulaire d'avis -->
  <section class="container mb-5">
    <div class="card shadow-lg">
      <div class="card-body">
        <h3 class="card-title mb-4" id="form-title">Laissez votre avis</h3>
        <form id="review-form">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="nom" id="label-nom" class="form-label">Nom (optionnel)</label>
              <input type="text" id="nom" name="nom" class="form-control">
            </div>
            <div class="col-md-6">
              <label for="commentaire" id="label-commentaire" class="form-label">Commentaires</label>
              <input type="text" id="commentaire" name="commentaire" class="form-control">
            </div>
          </div>
          <div id="dynamic-criteria"></div>
          <div class="d-flex justify-content-between align-items-center mt-4">
            <button type="submit" id="submit-btn" class="btn btn-primary btn-lg px-5">Envoyer l'avis</button>
            <a href="avis.html" id="link-avis" class="btn btn-outline-secondary">Voir les avis</a>
          </div>
        </form>
      </div>
    </div>
  </section>
  </main>
  <footer class="bg-dark text-white text-center py-4 mt-5">
    <div class="container">
      <img src="img/logo-hotel.png" alt="Logo Hôtel" width="40" class="mb-2">
      <p class="mb-0">&copy; 2025 Eventi production. Tous droits réservés.</p>
      <small>complexe sportif de hay Al Adarissa | 05357491 | eventiprod@gmail.com</small>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
