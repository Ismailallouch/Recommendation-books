<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gestion des critères</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2>Connexion administrateur</h2>
    <form id="login-form" class="mb-4">
      <div class="mb-3">
        <label for="password" class="form-label">Mot de passe</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Se connecter</button>
    </form>
    <div id="admin-panel" style="display:none;">
      <h3>Gestion des critères</h3>
      <form id="add-criteria-form" class="mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-auto">
            <input type="text" id="critere-nom" class="form-control" placeholder="Nom du critère" required>
          </div>
          <div class="col-auto">
            <select id="critere-obligatoire" class="form-select">
              <option value="true">Obligatoire</option>
              <option value="false">Optionnel</option>
            </select>
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-success">Ajouter</button>
          </div>
        </div>
      </form>
      <ul id="criteria-list" class="list-group"></ul>
    </div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
